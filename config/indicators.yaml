# Archway Macro-Monitoring Agent: indicator watchlist
#
# SCOPE: the course brief allows 1 to 3 indicators that Archway already monitors.
# Chosen from the macro team interview (recorded 2026-11-17):
#   - risk-free rate / Treasuries: "a big one", updated every week [01:42, 01:56]
#   - inflation, "both core and regular" [02:06]
# NEEDS CLARIFICATION with Archway: which Treasury maturity counts as the
# risk-free rate (10-year used as a placeholder), CPI vs PCE for inflation,
# and which calculations they show. GDP and Michigan sentiment were also named.
# Students own this file; the agent never edits it.
#
# Fields
#   id          FRED series ID (https://fred.stlouisfed.org)
#   name        Display name
#   group       Dashboard section
#   frequency   D, W, M or Q (how often FRED publishes it)
#   units       How the raw value is expressed
#   headline    The main number shown on the dashboard:
#                 yoy_pct  year-over-year % change      level  the value itself
#   csv_calcs   Calculated columns saved in the CSV (only what Archway uses):
#                 yoy_pct  year-over-year % change
#                 change   change from the prior observation (in the series' units)
#   stale_days  Flag if the latest observation's reference date is older than this.
#               FRED dates monthly data to the 1st of the month and releases it weeks
#               later, so a healthy monthly series is often 40-70 days "old".
#   z_flag      Flag a move for student review when |z-score of latest change| exceeds this

settings:
  history_start: "2000-01-01"   # history pulled for calculations and the trend line
  csv_start: "2020-01-01"       # first date written to each CSV on its first run
  z_window_years: 5             # trailing window for "unusual move" checks
  output_dir: "docs/data"       # GitHub Pages serves /docs

indicators:
  - {id: DGS10, name: "Risk-free rate: 10-year Treasury", group: Rates, frequency: D, units: "%",
     headline: level, csv_calcs: [change], stale_days: 7, z_flag: 2.5}
  - {id: CPIAUCSL, name: "Inflation: CPI (headline)", group: Inflation, frequency: M, units: "Index 1982-84=100",
     headline: yoy_pct, csv_calcs: [yoy_pct], stale_days: 75, z_flag: 2.0}
  - {id: CPILFESL, name: "Inflation: core CPI", group: Inflation, frequency: M, units: "Index 1982-84=100",
     headline: yoy_pct, csv_calcs: [yoy_pct], stale_days: 75, z_flag: 2.0}
