# Independent verification for Assignment 3. Run it after "Update macro data".
# Actions → Verify against FRED → Run workflow. Writes verification/REPORT.md.
name: Verify against FRED

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Offline tests
        run: pytest -q
      - name: Check saved data against FRED
        id: verify
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python verify/verify_fred.py
      - name: Save report
        run: |
          cat verification/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          git config user.name  "archway-macro-agent"
          git config user.email "actions@users.noreply.github.com"
          git add verification/REPORT.md
          git diff --cached --quiet || git commit -m "verify: report $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - name: Fail if any check failed
        if: steps.verify.outcome == 'failure'
        run: exit 1
