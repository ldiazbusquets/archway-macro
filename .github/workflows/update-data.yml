# Runs the agent on a schedule and publishes the results to the dashboard.
# Secrets (Settings → Secrets and variables → Actions), owned by the fund account:
#   FRED_API_KEY        required  (free: https://fred.stlouisfed.org/docs/api/api_key.html)
#   ANTHROPIC_API_KEY   optional  (turns on the AI-drafted weekly digest)
name: Update macro data

on:
  schedule:
    # Weekdays 14:17 UTC (after most 8:30 ET releases) and 22:17 UTC (after daily rates post)
    - cron: "17 14 * * 1-5"
    - cron: "17 22 * * 1-5"
  workflow_dispatch: {}   # "Run workflow" button for manual refreshes

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run agent
        id: agent
        continue-on-error: true      # still publish what we have, then fail visibly below
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m agent.run

      - name: Commit updated data
        run: |
          git config user.name  "archway-macro-agent"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "data: agent run $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Fail if the agent raised error flags
        if: steps.agent.outcome == 'failure'
        run: |
          echo "::error::Agent finished with error flags. See the run summary and the dashboard's Review queue."
          exit 1
